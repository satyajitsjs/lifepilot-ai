# Development-only compose. MCP HTTP intentionally bound to localhost.
services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/lifepilot.db
      FRONTEND_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      MCP_MODE: stdio
    volumes:
      - lifepilot_data:/data
    ports:
      - "127.0.0.1:8000:8000"
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      args:
        API_BACKEND_URL: http://api:8000
    environment:
      API_BACKEND_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
  mcp:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    command: ["python", "services/mcp-server/server.py", "--http"]
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/lifepilot.db
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8010"
    volumes:
      - lifepilot_data:/data
    ports:
      - "127.0.0.1:8010:8010"
volumes:
  lifepilot_data:
